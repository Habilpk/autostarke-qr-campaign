<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Congratulations! You Won</title>
<style>
body {
  text-align: center;
  background: #f0fff0;
  font-family: Arial, sans-serif;
}

.container {
  padding: 40px;
}

h1 {
  color: green;
  font-size: 36px;
}

p {
  font-size: 18px;
}

button {
  padding: 10px 20px;
  background-color: green;
  color: white;
  border: none;
  border-radius: 6px;
  cursor: pointer;
  font-size: 16px;
}
button:hover {
  background-color: darkgreen;
}
</style>
</head>
<body>

<script>
// Check if the user has submitted the form (localStorage)
if (!localStorage.getItem('user_submitted')) {
  window.location.href = 'index.html'; // Redirect to form if not submitted
}

// Optional: Clear session once they reach the reward page
localStorage.removeItem('user_submitted');
</script>

<div class="container">
  <h1>🎉 Congratulations!</h1>
  <p>You WON! Please take a screenshot of this page<br> and show it at the counter to claim your gift.</p>
  <button onclick="window.location.href='index.html'">Play Again</button>
</div>

</body>
</html>
