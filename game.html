<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Scratch & Win - Autostarke Energy</title>
<style>
body {
  font-family: Arial, sans-serif;
  text-align: center;
  background: #f9f9f9;
  padding: 20px;
}

.container {
  background: #fff;
  border-radius: 12px;
  padding: 20px;
  max-width: 400px;
  margin: auto;
  box-shadow: 0 2px 8px rgba(0,0,0,0.1);
}

h1 {
  color: #007b5e;
}

button {
  padding: 12px;
  margin-top: 15px;
  width: 80%;
  background-color: #007b5e;
  color: white;
  border: none;
  border-radius: 6px;
  cursor: pointer;
  font-size: 16px;
}

button:hover {
  background-color: #005b46;
}

.card {
  margin: 20px auto;
  width: 250px;
  height: 150px;
  background-color: #ccc;
  border-radius: 12px;
  position: relative;
  overflow: hidden;
  cursor: pointer;
  box-shadow: 0 2px 6px rgba(0,0,0,0.3);
}

.card-content {
  position: absolute;
  top: 0; left: 0;
  width: 100%;
  height: 100%;
  background-color: #007b5e;
  color: white;
  display: flex;
  justify-content: center;
  align-items: center;
  font-size: 24px;
}

.cover {
  position: absolute;
  top: 0; left: 0;
  width: 100%;
  height: 100%;
  background: repeating-linear-gradient(45deg, #ddd, #ddd 10px, #eee 10px, #eee 20px);
  z-index: 2;
  transition: opacity 0.5s;
}
</style>
</head>
<body>
<div class="container">
  <h1>Scratch & Win!</h1>
  <p>Tap the card to reveal your prize. If you WIN, show the screen at counter.</p>

  <div class="card" onclick="revealCard()">
    <div class="card-content" id="cardText">?</div>
    <div class="cover" id="cover"></div>
  </div>

  <button onclick="window.location.href='index.html'">Back to Home</button>
</div>

<script>
if (!localStorage.getItem('user_submitted')) {
  window.location.href = 'index.html'; // Force back to form if skipped
}

</body>
</html>
